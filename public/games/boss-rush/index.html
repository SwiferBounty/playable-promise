<!doctype html>
<html><head><meta charset="utf-8"><title>Boss Rush (demo game)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0b0a12;color:#cfc8e8;font:12px/1.2 "DejaVu Sans Mono","Courier New",monospace}
  body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at center,#1a1430 0%,#0b0a12 70%)}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
  h1{margin:0;font-size:13px;letter-spacing:4px;color:#ffd35a;text-shadow:0 0 8px rgba(255,211,90,.35)}
  canvas{display:block;width:min(96vw,calc((100vh - 64px) * 3));height:auto;image-rendering:pixelated;image-rendering:crisp-edges;
    border:2px solid #2e2846;border-radius:3px;box-shadow:0 0 0 2px #0b0a12,0 8px 30px rgba(120,60,200,.25)}
  .controls{margin:0;font-size:12px;color:#e8e2ff;letter-spacing:.5px}
  kbd{display:inline-block;padding:0 4px;border:1px solid #5a4f7a;border-bottom-width:2px;border-radius:3px;background:#1d1830;color:#fff;font:inherit}
</style>
</head><body>
<div class="wrap">
  <h1>BOSS RUSH</h1>
  <canvas id="c" width="720" height="240"></canvas>
  <p class="controls">Controls: <kbd>←</kbd><kbd>→</kbd> Arrow Left/Right move · <kbd>↑</kbd>/<kbd>Space</kbd> jump · <kbd>Z</kbd>/<kbd>X</kbd> attack</p>
</div>
<script src="game.js"></script>
</body></html>
